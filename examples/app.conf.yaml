## For use proxy you should:
##   Pass env DOCKER_HOST with address to proxy (see unixSocketPath/bindAddress params)
##   Pass env DOCKER_CUSTOM_HEADERS with X-Auth-Token header. Header value is user token from usersConfigPath
## Example:
##   export DOCKER_CUSTOM_HEADERS="X-Auth-Token=EXAMPLE-T0Ken-1111"
##   export DOCKER_HOST="from unixSocketPath/bindAddress params"
##   docker image ls

## if need create unix-socket for proxy
unixSocketPath: /run/docker-proxy.socket 

## if need bind to port
# bindAddress: "127.0.0.1:8081"

## Docker server address
## can be path to unix-socket or addr:port 
## by default, /run/docker.sock
# dockerAddress: "/run/docker.sock"

## Users config file
## See ./users.conf.yaml for example
usersConfigPath: "./.test.users.yaml"
